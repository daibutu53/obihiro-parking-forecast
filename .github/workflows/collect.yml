name: collect

# 5分ごとの記録は Supabase の pg_cron（cron.sql の obp-collect）が担当。
# GitHub の定期実行はこのリポジトリで動かなかったので外し、手動の予備としてだけ残す。
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Collect parking status
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python3 collect.py
